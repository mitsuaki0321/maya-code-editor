<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maya Code Editor</title>
<link rel="stylesheet" href="vendor/monaco/vs/editor/editor.main.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="toolbar">
  <button id="run-button" class="primary" title="Run selection or file (Ctrl+Enter)">
    <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
    <span>Run</span>
  </button>
  <span class="separator"></span>
  <button id="new-button" class="icon" title="New File (Ctrl+N)" aria-label="New File">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M9 1.5H4.5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V5z"/><path d="M9 1.5V5h3.5"/><path d="M6 9.5h4M8 7.5v4"/></svg>
  </button>
  <button id="save-button" class="icon" title="Save (Ctrl+S)" aria-label="Save">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11z"/><path d="M4.5 2.5v4h6v-4M5 13.5V9.5h6v4"/></svg>
  </button>
  <button id="save-all-button" class="icon" title="Save All (Ctrl+K S)" aria-label="Save All">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4.5 4.5h7l2 2v7h-9z"/><path d="M6.5 4.5v3h4v-3M7 13.5v-3h4v3"/><path d="M2.5 10.5v-8h7"/></svg>
  </button>
  <span class="separator"></span>
  <span id="toolbar-path" title=""></span>
  <span class="spacer"></span>
  <button id="terminal-button" class="icon" title="Show / hide terminal" aria-label="Toggle Terminal">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M4 6l2.5 2L4 10M8 10h4"/></svg>
  </button>
  <button id="settings-button" class="icon" title="Open settings.json (changes apply on next start)" aria-label="Settings">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"/></svg>
  </button>
</div>
<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="workspace-name">EXPLORER</span>
      <button id="refresh-button" title="Refresh">&#x21bb;</button>
    </div>
    <div id="file-tree"></div>
  </div>
  <div id="gutter"></div>
  <div id="content">
    <div id="tab-bar"></div>
    <div id="editor"></div>
    <div id="empty-state">Open a file from the explorer, or press Ctrl+N.</div>
  </div>
</div>
<div id="status-bar">
  <span id="status-env"></span>
  <span id="status"></span>
  <span class="spacer"></span>
  <span id="status-cursor"></span>
  <span id="status-indent"></span>
  <span id="status-encoding">UTF-8</span>
  <span id="status-language"></span>
  <span id="status-theme"></span>
</div>
<div id="context-menu" hidden></div>
<div id="dialog-overlay" hidden>
  <div id="dialog" role="dialog">
    <div id="dialog-title"></div>
    <div id="dialog-message"></div>
    <input id="dialog-input" type="text" autocomplete="off" spellcheck="false">
    <div id="dialog-buttons"></div>
  </div>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="vendor/monaco/vs/loader.js"></script>
<script src="themes/dark-modern.js"></script>
<script src="themes/light-modern.js"></script>
<script src="js/bridge.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/completion.js"></script>
<script src="js/file_tree.js"></script>
<script src="js/tabs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
